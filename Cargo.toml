[package]
name = "cargo-test-prune"
version = "0.1.0"
edition = "2024"
description = "Find Rust tests with overlapping mutation detection"
license = "MIT"
repository = "https://github.com/yasuyuky/cargo-test-prune"
readme = "README.md"
keywords = ["cargo", "testing", "mutation-testing", "test-reduction"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]
# Integration tests use a nested fixture package that Cargo excludes from archives.
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
